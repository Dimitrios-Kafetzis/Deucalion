# Publishes a GitHub release when a version tag (v1.2.3) is pushed, with that version's notes
# from CHANGELOG.md. The tag must match deucalion/__init__.py's __version__.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          code="$(python3 -c 'import deucalion; print(deucalion.__version__)')"
          if [[ "$version" != "$code" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $code"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Take the notes from CHANGELOG.md
        run: |
          # The section for this version, with wrapped lines joined (GitHub keeps line breaks in
          # release notes)
          python3 - "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md" <<'EOF'
          import re, sys
          version, path = sys.argv[1], sys.argv[2]
          out, inside = [], False
          for line in open(path, encoding="utf-8").read().splitlines():
              if line.startswith("## ["):
                  if inside:
                      break
                  inside = line.startswith(f"## [{version}]")
                  continue
              if not inside or re.match(r"^\[[^\]]+\]: ", line):
                  continue
              continuation = line.startswith("  ") or not re.match(r"^(#|- |---|$)", line)
              if continuation and out and out[-1] and not out[-1].startswith("#"):
                  out[-1] += " " + line.strip()
              else:
                  out.append(line)
          text = "\n".join(out).strip()
          if not text:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(text)
          print()
          print("---")
          print()
          print("**Install or update:** see [Install Deucalion]"
                "(https://dimitrios-kafetzis.github.io/Deucalion/getting-started/install/).")
          print()
          print("**Documentation:** https://dimitrios-kafetzis.github.io/Deucalion/")
          EOF
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Deucalion $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
