site_name: Deucalion
site_description: Back up your Ubuntu computer to an external drive, restore files, and rebuild the whole machine on a new Ubuntu version or a new computer.
site_url: https://dimitrios-kafetzis.github.io/Deucalion/
repo_url: https://github.com/Dimitrios-Kafetzis/Deucalion
repo_name: Dimitrios-Kafetzis/Deucalion
edit_uri: edit/main/docs/
copyright: Deucalion · documentation for version 0.2.0
docs_dir: docs
strict: true
validation:            # every link, and every #anchor, must point somewhere real
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

exclude_docs: |
  tools/
  snippets/
  requirements.txt

theme:
  name: material
  language: en
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: false
      skip_classes:
        - no-lightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - abbr
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

